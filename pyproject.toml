[project]
name = "skill-builder"
version = "1.0.0"
description = "Community skill library with uv-based dependency resolution"
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}

[tool.uv.workspace]
members = ["skills/*"]

[tool.agentskills]
# Router configuration
resolver = "uv"
index_command = "uv tree --depth 1"
activation_strategy = "lazy"

[tool.uv]
dev-dependencies = [
    "pyyaml>=6.0",
]
