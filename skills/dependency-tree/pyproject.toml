[project]
name = "dependency-tree"
version = "1.0.0"
description = "Visualize skill dependency graph using uv. Shows which skills depend on what, detects conflicts, suggests resolution order."
requires-python = ">=3.10"

# No dependencies - this is a meta-skill that uses uv
dependencies = []

[tool.agentskills]
keywords = [
    "dependency-resolution",
    "skill-graph",
    "prerequisite-chain",
    "uv-tree",
    "conflict-detection"
]

exit_when = [
    "Not in skill-builder workspace",
    "uv is not installed",
    "No skills installed yet"
]

proceed_when = [
    "Need to understand skill relationships",
    "Debugging circular dependencies",
    "Planning skill activation order"
]

skill_type = "tool-function"
