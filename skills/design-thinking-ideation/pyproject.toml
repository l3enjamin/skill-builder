[project]
name = "design-thinking-ideation"
version = "1.0.0"
description = "Generate divergent solution concepts from a problem statement. Requires defined problem space, produces ranked idea candidates."
requires-python = ">=3.10"

# This skill has no dependencies - it's self-contained
dependencies = []

[tool.agentskills]
keywords = [
    "brainstorming",
    "concept-generation",
    "divergent-thinking",
    "ideation",
    "creative-problem-solving",
    "design-thinking"
]

exit_when = [
    "Problem statement is missing or undefined",
    "User wants convergent solution, not exploration",
    "Time constraint under 5 minutes"
]

proceed_when = [
    "Problem is defined but solution space is open",
    "Multiple stakeholder perspectives available",
    "Quantity of ideas valued over immediate quality"
]

skill_type = "cognitive"
