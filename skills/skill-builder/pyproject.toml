[project]
name = "skill-builder"
version = "1.0.0"
description = "Meta-skill for creating new reusable skills. Research, compile, and validate skills using structured templates."
requires-python = ">=3.10"

# No dependencies - this is the bootstrap skill
dependencies = []

[tool.agentskills]
keywords = [
    "create-skill",
    "new-skill",
    "skill-generation",
    "meta-skill",
    "skill-template",
    "skill-research"
]

exit_when = [
    "User just wants to use existing skills, not create new ones",
    "Skill already exists in library",
    "Request is for modifying existing skill (use skill-updater instead)"
]

proceed_when = [
    "User wants to create a new skill from scratch",
    "Need to document a complex workflow as reusable skill",
    "Converting manual procedure into skill format"
]

skill_type = "orchestration"
